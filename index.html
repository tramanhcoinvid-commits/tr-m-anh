<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#243b75 0%,transparent 40%),linear-gradient(135deg,#050814,#0b1020 50%,#050814);display:flex;justify-content:center;align-items:center;padding:30px 15px}
.profile{width:100%;max-width:480px;text-align:center;padding:35px 25px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:25px;backdrop-filter:blur(15px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.avatar{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 25px rgba(90,150,255,.7)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;margin-bottom:7px}.username{color:#8da9ff;font-size:14px;margin-bottom:20px}
.bio{color:#d8dbea;line-height:1.7;font-size:15px;margin-bottom:25px}
.buttons{display:flex;flex-direction:column;gap:12px}
.btn{width:100%;padding:15px;border-radius:14px;text-decoration:none;color:#fff;font-size:16px;font-weight:bold;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.25s}
.btn span{margin-right:8px}.btn:hover{transform:translateY(-3px);background:linear-gradient(90deg,#5865f2,#8b5cf6);box-shadow:0 10px 25px rgba(88,101,242,.35)}
.info{margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.info-item{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 0;color:#cdd2e5;font-size:14px}.info-item strong{width:25px}
footer{margin-top:25px;color:#737b96;font-size:12px}
@media(max-width:500px){.profile{padding:30px 20px}.avatar{width:105px;height:105px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="profile">
<div class="avatar"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500" alt="Ảnh đại diện"></div>
<h1>TRÂM ANH ONLINE</h1>
<div class="username">@tramanhonline</div>
<div class="bio">Xin chào! 👋<br>Mình là TRÂM ANH ONLINE.<br>Yêu thích công nghệ, kinh doanh và khám phá những điều mới. Mình đang làm tại nhà và cần cộng tác viên ạ</div>
<div class="buttons">
<a class="btn" href="https://t.me/thaotranggroup" target="_blank"><span>ⓕ</span>Gửi CV</a>
<a class="btn" href="https://www.tiktok.com/@tramanhonline" target="_blank"><span>♪</span>TikTok</a>

</div>
<div class="info">
</div>
<footer>© 2026 TRÂM ANH </footer>
</div>
</body>
</html>
